<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<link rel=stylesheet type="text/css" href="/house.css" title="House">
<script>

const AlmanacDays = ["yesterday", "today", "tomorrow"];
const AlmanacTimes = ["sunrise", "sunset"];

const AlmanacDate = new Intl.DateTimeFormat (undefined, {dateStyle: "full"});
const AlmanacTime = new Intl.DateTimeFormat (undefined, {timeStyle: "medium"});
const AlmanacAll = new Intl.DateTimeFormat (undefined, {dateStyle: "short",
                                                        timeStyle: "medium"});
const AlmanacMedium = Intl.DateTimeFormat (undefined, {dateStyle: "short",
                                                       timeStyle: "medium"});

function showDateTime (time) {
    if (! time) return '';
    return AlmanacAll.format (new Date (time * 1000));
}

function showDate (time) {
    if (! time) return '';
    return AlmanacDate.format (new Date (time * 1000));
}

function showTime (time) {
    if (! time) return '';
    return AlmanacTime.format (new Date (time * 1000));
}

function AlmanacUpdate (response) {

    var title = response.host+' - Sunrise-Sunset.org';
    document.getElementsByTagName ('title')[0].innerHTML = title;

    if (response.location) {
        const lat = response.location.lat;
        const long = response.location.long;
        const timezone = response.location.timezone;
        document.getElementById('latitude').innerHTML = lat?lat:'';
        document.getElementById('longitude').innerHTML = long?long:'';
        document.getElementById('timezone').innerHTML = timezone?timezone:'';
    } else {
        document.getElementById('latitude').innerHTML = '';
        document.getElementById('longitude').innerHTML = '';
        document.getElementById('timezone').innerHTML = '';
    }

    document.getElementById('localtime').innerHTML =
        showDateTime(response.timestamp);

    if (response.almanac) {
        if (response.almanac.priority) {
            const e = document.getElementById('priority');
            if (e) e.innerHTML = response.almanac.priority;
        }
        if (response.almanac.origin) {
            const e = document.getElementById('origin');
            if (e) e.innerHTML = '<a href="'+response.almanac.origin+'">'+response.almanac.origin+'</a>';
        }
        const e = document.getElementById('updated');
        if (e) e.innerHTML = showDateTime(response.almanac.updated);

        const table = document.getElementById ('almanac');
        if (table) {
            for (var i = table.childNodes.length - 1; i > 1; i--) {
                 table.removeChild(table.childNodes[i]);
            }
        }

        for (var i = 0; i < AlmanacDays.length; ++i) {
            const day = AlmanacDays[i];
            const dayset = response.almanac[day];
            for (var j = 0; j < AlmanacTimes.length; ++j) {
                const time = AlmanacTimes[j];
                const e = document.getElementById(day+time);
                if (e) {
                    if (dayset) {
                        e.innerHTML = showDateTime(dayset[time]);
                    } else {
                        e.innerHTML = '';
                    }
                }
            }
            if (dayset && table) {
                var row = document.createElement("tr");
                var cell = document.createElement("td");
                cell.innerHTML = day;
                row.appendChild(cell);
                cell = document.createElement("td");
                cell.innerHTML = showDate(dayset.sunset);
                row.appendChild(cell);
                cell = document.createElement("td");
                cell.innerHTML = showTime(dayset.sunrise);
                row.appendChild(cell);
                cell = document.createElement("td");
                cell.innerHTML = showTime(dayset.sunset);
                row.appendChild(cell);
                table.appendChild(row);
            }
        }

        const dayset = response.almanac.tonight;
        if (dayset) {
            for (var j = 0; j < AlmanacTimes.length; ++j) {
                const time = AlmanacTimes[j];
                const e = document.getElementById('tonight'+time);
                if (e) {
                    e.innerHTML = showDateTime(dayset[time]);
                }
            }
        }
    }
}

function AlmanacRefresh () {

    var command = new XMLHttpRequest();
    command.open("GET", "/sun/status");
    command.onreadystatechange = function () {
        if (command.readyState === 4 && command.status === 200) {
            AlmanacUpdate(JSON.parse(command.responseText));
        }
    }
    command.send(null);
}

window.onload = function() {
   AlmanacRefresh();
   setInterval (AlmanacRefresh, 5000);
}
</script>
<title></title>
</head>
<body>
   <nav>
   <table>
   <tr>
   <td><span>Status</span></td>
   <td><a href="/sun/events.html">Events</a></td>
   </tr>
   </table>
   </nav>
   <main>
   <article>
   <table class="housepanel">
   <tr><td>
   <div class="housepane">
   <table class="housestatus">
   <tr><td colspan="2"><span class="housetitle">Location</span></td></tr>
   <tr><td>Latitude:</td>
   <td><span class="housedata" id="latitude"></span></td></tr>
   <tr><td>Longitude:</td>
   <td><span class="housedata" id="longitude"></span></td></tr>
   <tr><td>Local Time:</td>
   <td><span class="housedata" id="localtime"></span></td></tr>
   <tr><td>Updated:</td>
   <td><span class="housedata" id="updated"></span></td></tr>
   <tr><td>Time Zone:</td>
   <td><span class="housedata" id="timezone"></span></td></tr>
   <tr><td>Origin:</td>
   <td><span class="housedata" id="origin"></span></td></tr>
   <tr><td>Priority:</td>
   <td><span class="housedata" id="priority"></span></td></tr>
   </table>
   </div>
   </td></tr>
   <tr><td>
   <div class="housepane">
   <table class="housestatus">
   <tr><td colspan="2"><span class="housetitle">Tonight Almanac</span></td></tr>
   <tr><td>Sunset:</td>
   <td><span class="housedata" id="tonightsunset"></span></td></tr>
   <tr><td>Sunrise:</td>
   <td><span class="housedata" id="tonightsunrise"></span></td></tr>
   </table>
   </div>
   </td></tr>
   <tr><td>
   <div class="housepane">
   <table class="housestatus">
   <tr><td colspan="2"><span class="housetitle">Today Almanac</span></td></tr>
   <tr><td>Sunrise:</td>
   <td><span class="housedata" id="todaysunrise"></span></td></tr>
   <tr><td>Sunset:</td>
   <td><span class="housedata" id="todaysunset"></span></td></tr>
   </table>
   </div>
   </td></tr>
   </table> 
   <table id="almanac" class="housesidetable">
      <tr>
         <th width="20%"></th>
         <th width="40%">DATE</th>
         <th width="20%">SUNRISE</th>
         <th width="20%">SUNSET</th>
      </tr>
   </table>
   </article>
   </main>
</body>
</html>
